<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Study Discussion Club</title>
<style>
:root { --accent:#6C63FF; --accent2:#00C2A8;}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}
body{
  background:radial-gradient(circle at 50% 20%,#2a2a72 0%,#000 90%);
  color:white;text-align:center;padding:18px;
}
.hidden{display:none;}
.grid{
  margin-top:25px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px;
}
.card{
  background:rgba(255,255,255,0.08);
  padding:18px;border-radius:14px;cursor:pointer;transition:0.25s;
}
.card:hover{background:rgba(255,255,255,0.18);}
.card img{width:70px;height:70px;margin-bottom:6px;}
.logoutBtn{
  margin-top:35px;background:linear-gradient(90deg,var(--accent),var(--accent2));
  border:none;padding:12px 22px;border-radius:10px;color:white;font-weight:700;
  cursor:pointer;
}
.backBtn{
  position:absolute;left:12px;top:12px;border:none;
  background:rgba(255,255,255,0.13);
  padding:8px 14px;border-radius:10px;color:white;cursor:pointer;
}
#imgList img{
  width:100%;border-radius:14px;margin-bottom:20px;
  border:2px solid rgba(255,255,255,0.2);
}
</style>
</head>
<body>

<div id="homeScreen">
<h2 id="examName">Your Course</h2>
<p>Select a learning section</p>
<div class="grid" id="sectionGrid"></div>
<button class="logoutBtn" onclick="logoutUser()">Logout</button>
</div>

<div id="sectionScreen" class="hidden">
<button class="backBtn" onclick="goBack()">⭠ Back</button>
<h2 id="secTitle">Loading...</h2>
<div id="imgList"></div>
</div>

<script>
// Selected exam
const exam = localStorage.getItem("selectedExam");
if(!exam){
  alert("Please select an exam first!");
  window.location.href="select.html";
}

document.getElementById("examName").innerText = exam + " Course";

// Section cards
let sectionCards = {};
if(exam==="UPSC"){
  sectionCards = {
    current:{label:"Current Affairs", icon:"https://cdn-icons-png.flaticon.com/512/3135/3135715.png", link:"https://raw.githubusercontent.com/Sajanpreet35/Bighit/main/upsc_currentaffairs.json"},
    practice:{label:"Practice Questions", icon:"https://cdn-icons-png.flaticon.com/512/201/201572.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/main/upsc%20practise%20questions.json"},
    mindmap:{label:"Mind Maps", icon:"https://cdn-icons-png.flaticon.com/512/952/952717.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/main/mindmaps.json"},
    interview:{label:"Interview Q&A", icon:"https://cdn-icons-png.flaticon.com/512/3135/3135810.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/main/upscinterviewpractisequestions.json"},
    books:{label:"UPSC Book Summary", icon:"https://cdn-icons-png.flaticon.com/512/942/942748.png", link:"https://raw.githubusercontent.com/Sajanpreet35/Bighit/main/upsc_books.json"},
    social:{label:"Social Media Material", icon:"https://cdn-icons-png.flaticon.com/512/1384/1384060.png", link:"https://raw.githubusercontent.com/Sajanpreet35/Bighit/main/social_media_material.json"},
    contest:{label:"Contest", icon:"https://cdn-icons-png.flaticon.com/512/1828/1828884.png", link:"contest.html"}
  };
}else if(exam==="NEET"){
  sectionCards = {
    physics:{label:"Physics", icon:"https://cdn-icons-png.flaticon.com/512/3135/3135715.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/main/neetphysics.json"},
    chemistry:{label:"Chemistry", icon:"https://cdn-icons-png.flaticon.com/512/201/201572.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/main/neetchemistry.json"},
    biology:{label:"Biology", icon:"https://cdn-icons-png.flaticon.com/512/952/952717.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/2a82ba6620749575ae169d17b1f430033e43ca4a/biology_practisequestions.json"},
    books:{label:"Book Summary", icon:"https://cdn-icons-png.flaticon.com/512/942/942748.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/2a82ba6620749575ae169d17b1f430033e43ca4a/neet_bookssummary.json"},
    social:{label:"Social Media Material", icon:"https://cdn-icons-png.flaticon.com/512/1384/1384060.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/2a82ba6620749575ae169d17b1f430033e43ca4a/neetsocialmedia.json"},
    hidden:{label:"Hidden Topics", icon:"https://cdn-icons-png.flaticon.com/512/1828/1828884.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/main/neethiddentopics.json"}
  };
}else if(exam==="NDA"){
  sectionCards = {
    current:{label:"Current Affairs", icon:"https://cdn-icons-png.flaticon.com/512/3135/3135715.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/main/ndacurrentaffairs.json"},
    english:{label:"English Grammar", icon:"https://cdn-icons-png.flaticon.com/512/201/201572.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/main/ndaenglishgrammer.json"},
    interview:{label:"Interview Q&A", icon:"https://cdn-icons-png.flaticon.com/512/952/952717.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/0148caa586f5b4cfa40a8d09dd3f2c47398c3424/nda_interviewpq.json"},
    history:{label:"History", icon:"https://cdn-icons-png.flaticon.com/512/942/942748.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/main/ndahistory.json"},
    math:{label:"Math", icon:"https://cdn-icons-png.flaticon.com/512/1384/1384060.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/main/ndamath.json"},
    gk:{label:"GK", icon:"https://cdn-icons-png.flaticon.com/512/1828/1828884.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/main/ndagk.json"},
    geography:{label:"Geography", icon:"https://cdn-icons-png.flaticon.com/512/1828/1828884.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/main/ndageography.json"},
    physics:{label:"Physics", icon:"https://cdn-icons-png.flaticon.com/512/3135/3135715.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/main/ndaphysics.json"},
    chemistry:{label:"Chemistry", icon:"https://cdn-icons-png.flaticon.com/512/201/201572.png", link:"https://raw.githubusercontent.com/avnoordeepsingh733-svg/Avnoor/main/ndachemistry.json"}
  };
}

// Inject cards
const grid = document.getElementById("sectionGrid");
for(let key in sectionCards){
  const c = sectionCards[key];
  let div = document.createElement("div");
  div.className = "card";
  div.onclick = ()=>openSection(key);
  div.innerHTML = `<img src="${c.icon}"><div>${c.label}</div>`;
  grid.appendChild(div);
}

// Links mapping
const links = {};
for(let key in sectionCards) links[key] = sectionCards[key].link;

// Open section
async function openSection(sec){
  if(links[sec] === "contest.html"){
    window.location.href = "contest.html";
    return;
  }
  document.getElementById("homeScreen").classList.add("hidden");
  document.getElementById("sectionScreen").classList.remove("hidden");
  try{
    let data = await fetch(links[sec]).then(r=>r.json());
    document.getElementById("secTitle").innerText = data.title || sectionCards[sec].label;
    let list=document.getElementById("imgList"); list.innerHTML="";
    if(data.images && data.images.length>0){
      data.images.forEach(src=>{ let i=document.createElement("img"); i.src=src; list.appendChild(i); });
    } else list.innerHTML="<p>No images found for this section.</p>";
  }catch(e){ document.getElementById("secTitle").innerText="Failed to load data."; }
}

// Go back
function goBack(){ document.getElementById("sectionScreen").classList.add("hidden"); document.getElementById("homeScreen").classList.remove("hidden"); }

// Logout
function logoutUser(){ localStorage.clear(); window.location.href="select.html"; }

</script>
</body>
</html>8
